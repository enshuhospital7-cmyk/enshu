<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="referrer" content="no-referrer">
<title>あみだくじ｜当番決め</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --primary:#0d9488;--primary-dark:#0f766e;--primary-light:#ccfbf1;--primary-soft:#f0fdfa;
  --accent:#0284c7;--accent-light:#e0f2fe;
  --bg:#eef2f7;--surface:#fff;--surface-2:#f8fafc;
  --border:#e6ebf1;--border-strong:#cbd5e1;
  --text:#1e293b;--muted:#64748b;--muted-2:#94a3b8;
  --danger:#dc2626;--danger-soft:#fef2f2;--danger-border:#fecaca;
  --warn:#d97706;--warn-soft:#fffbeb;--warn-border:#fde68a;
  --ok:#059669;--ok-soft:#ecfdf5;--ok-border:#a7f3d0;
  --radius:14px;--shadow:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
}
html{-webkit-text-size-adjust:100%;}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI',Meiryo,-apple-system,sans-serif;
  font-size:15px;line-height:1.6;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);}

.topbar{background:linear-gradient(90deg,#0f766e,#0d9488);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:50;box-shadow:0 1px 8px rgba(15,23,42,.16);}
.logo{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.tt{font-size:15px;font-weight:700;line-height:1.3;min-width:0;flex:1;}
.tt small{display:block;font-size:11px;font-weight:400;opacity:.85;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tb-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 12px;border-radius:9px;font-size:12px;cursor:pointer;font-family:inherit;flex-shrink:0;}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:5px 10px;border-radius:99px;flex-shrink:0;}
.live i{width:7px;height:7px;border-radius:50%;background:#4ade80;display:inline-block;animation:blink 1.6s infinite;}
.live.off i{background:#f87171;animation:none;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.wrap{max-width:640px;margin:0 auto;padding:16px 14px 60px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.ct{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.ct::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--primary);flex-shrink:0;}
.hint{font-size:12.5px;color:var(--muted);line-height:1.8;}
label{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:5px;}

input[type=text],textarea,select{width:100%;font-size:16px;padding:11px 13px;border:1px solid var(--border-strong);
  border-radius:10px;font-family:inherit;background:#fff;color:var(--text);outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
textarea{resize:vertical;line-height:1.8;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:11px;
  cursor:pointer;font-size:14.5px;border:1px solid var(--border-strong);background:#fff;color:var(--text);
  font-family:inherit;font-weight:600;width:100%;margin-bottom:9px;}
.btn:active{transform:scale(.99);}
.btn:disabled{opacity:.45;}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 6px rgba(13,148,136,.3);}
.btn-ghost{background:var(--surface-2);color:var(--muted);}
.btn-danger{color:var(--danger);border-color:var(--danger-border);}
.btn-row{display:flex;gap:9px;}
.btn-row .btn{margin-bottom:0;}
.btn-sm{width:auto;padding:7px 13px;font-size:12.5px;border-radius:8px;margin-bottom:0;}

.alert{padding:12px 14px;border-radius:11px;font-size:13.5px;margin-bottom:13px;line-height:1.75;border:1px solid;}
.alert-ok{background:var(--ok-soft);color:#065f46;border-color:var(--ok-border);}
.alert-warn{background:var(--warn-soft);color:#92400e;border-color:var(--warn-border);}
.alert-err{background:var(--danger-soft);color:#991b1b;border-color:var(--danger-border);}
.info{background:var(--accent-light);border:1px solid #bae6fd;border-left:3px solid var(--accent);border-radius:10px;
  padding:12px 14px;font-size:12.5px;color:#075985;line-height:1.85;margin-bottom:14px;}
.info b{color:#0c4a6e;}

.step{display:flex;gap:11px;margin-bottom:13px;align-items:flex-start;}
.step-n{width:25px;height:25px;border-radius:50%;background:var(--primary);color:#fff;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.step-b{font-size:13.5px;line-height:1.75;}
.step-b b{display:block;font-size:14px;margin-bottom:1px;color:var(--text);}

.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;}
.pick{border:1.5px solid var(--border-strong);background:#fff;border-radius:12px;padding:12px 4px;text-align:center;cursor:pointer;font-family:inherit;}
.pick .n{font-size:22px;font-weight:800;color:var(--primary-dark);display:block;line-height:1.1;}
.pick .s{font-size:10.5px;color:var(--muted-2);display:block;margin-top:3px;min-height:14px;}
.pick.sel{border-color:var(--primary);background:var(--primary);box-shadow:0 3px 10px rgba(13,148,136,.35);}
.pick.sel .n,.pick.sel .s{color:#fff;}
.pick.taken{background:var(--surface-2);border-color:var(--border);cursor:not-allowed;}
.pick.taken .n{color:var(--muted-2);}
.pick.taken .s{color:var(--text);font-weight:700;}
.pick.mine{background:var(--warn-soft);border-color:var(--warn-border);}
.pick.mine .n{color:var(--warn);}

.prog{background:var(--border);border-radius:99px;height:9px;overflow:hidden;}
.prog i{display:block;height:9px;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .4s;}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px;}
.stat div{background:linear-gradient(135deg,var(--primary-soft),#fff);border:1px solid var(--primary-light);border-radius:11px;padding:12px 6px;text-align:center;}
.stat b{display:block;font-size:22px;font-weight:800;color:var(--primary-dark);line-height:1.2;}
.stat span{font-size:10.5px;color:var(--muted);}

.big{background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;border-radius:16px;padding:22px 18px;text-align:center;margin-bottom:14px;box-shadow:0 6px 20px rgba(13,148,136,.3);}
.big .l{font-size:12px;opacity:.85;}
.big .n{font-size:15px;font-weight:600;margin-top:3px;}
.big .v{font-size:29px;font-weight:800;margin-top:6px;line-height:1.25;}

table.tbl{width:100%;border-collapse:collapse;font-size:14px;}
table.tbl th{text-align:left;padding:8px;color:var(--muted);font-weight:600;font-size:11px;border-bottom:2px solid var(--border);background:var(--surface-2);}
table.tbl td{padding:10px 8px;border-bottom:1px solid var(--border);}
table.tbl tr.me td{background:var(--warn-soft);font-weight:700;}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px;}

.wheel-wrap{position:relative;width:100%;max-width:min(330px,44vh);margin:0 auto;}
.wheel-wrap svg{width:100%;height:auto;display:block;}
#wheel-g{transform-origin:160px 160px;}
.rl-now{text-align:center;font-size:15px;font-weight:700;margin:6px 0 8px;min-height:44px;display:flex;flex-direction:column;justify-content:center;}
.rl-hit{font-size:25px;font-weight:800;color:var(--primary-dark);display:block;margin-top:2px;}
.rl-list{margin-top:14px;}
.rl-row{display:flex;align-items:center;gap:9px;padding:9px 4px;border-bottom:1px solid var(--border);font-size:13.5px;animation:pop .35s;}
@keyframes pop{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
.amida-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px;}
.amida-scroll svg{display:block;}
.path-line{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}

.chip{display:inline-block;padding:5px 11px;border-radius:99px;font-size:12px;border:1px solid var(--border);background:var(--surface-2);margin:2px;}
.mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;word-break:break-all;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:4px 0 10px;}
details.dt{border:1px solid var(--border);border-radius:11px;padding:11px 14px;background:var(--surface-2);font-size:12.5px;}
details.dt summary{cursor:pointer;font-weight:700;color:var(--muted);}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#1e293b;color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;box-shadow:0 8px 24px rgba(15,23,42,.35);z-index:900;opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.toast.err{background:#991b1b;}
@media print{.topbar,.no-print{display:none!important}.wrap{padding:0}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">🎋</div>
  <div class="tt">あみだくじ<small id="sub">当番決め</small></div>
  <span class="live" id="live" style="display:none"><i></i><span id="live-t">自動更新中</span></span>
  <button class="tb-btn no-print" id="tb-home" onclick="go('')" style="display:none">最初へ</button>
</div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   あみだくじ（オンライン版）

   ● 保存先
     Google Apps Script で作った小さな置き場（幹事のGoogleアカウント内）に
     名前と番号を自動保存します。参加者は開いて選ぶだけで、
     コードを送り返す必要はありません。

   ● 不正ができない仕組み（コミット・アンド・リビール）
     1. くじを作った時点で保存先が「封印番号」を作り、その要約
        （SHA-256ハッシュ）だけを全員に公開する。
     2. 参加者は縦線と4桁の数字を選ぶ。数字は入力と同時に全員に見える。
     3. 全員そろって初めて封印番号が公開され、
        「封印番号＋全員の4桁」から横線の位置が決まる。
     → 幹事は他人の4桁を知らず、参加者は封印番号を知らないので
       誰も結果を操作できない。あみだの線を引く計算は
       各自の端末で行われるので、保存先が結果を書き換えることもできない。
   ══════════════════════════════════════════════════════════════ */

/* ── SHA-256（自前実装：http でも動くように） ── */
const _K=new Uint32Array([
0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
const _r=(x,n)=>((x>>>n)|(x<<(32-n)))>>>0;
function sha256Bytes(data){
  const len=data.length,bl=len*8,total=(((len+9)+63)>>6)<<6;
  const m=new Uint8Array(total);m.set(data);m[len]=0x80;
  const dv=new DataView(m.buffer);
  dv.setUint32(total-8,Math.floor(bl/4294967296));dv.setUint32(total-4,bl>>>0);
  const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const w=new Uint32Array(64);
  for(let off=0;off<total;off+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(off+i*4);
    for(let i=16;i<64;i++){
      const x=w[i-15],y=w[i-2];
      w[i]=(w[i-16]+((_r(x,7)^_r(x,18)^(x>>>3))>>>0)+w[i-7]+((_r(y,17)^_r(y,19)^(y>>>10))>>>0))>>>0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){
      const S1=(_r(e,6)^_r(e,11)^_r(e,25))>>>0,ch=((e&f)^((~e)&g))>>>0;
      const t1=(h+S1+ch+_K[i]+w[i])>>>0;
      const S0=(_r(a,2)^_r(a,13)^_r(a,22))>>>0,mj=((a&b)^(a&c)^(b&c))>>>0;
      const t2=(S0+mj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  const o=new Uint8Array(32),odv=new DataView(o.buffer);
  for(let i=0;i<8;i++)odv.setUint32(i*4,H[i]);
  return o;
}
const _enc=new TextEncoder();
function sha256Hex(s){const b=sha256Bytes(_enc.encode(s));let r='';for(let i=0;i<32;i++)r+=b[i].toString(16).padStart(2,'0');return r;}

/* ── あみだの横線を決める ─────────────────────────────
   横線をランダムに引くだけだと、出発点の近くに当たりやすいという強い偏りが
   出る（12人で実測したところ、1番の縦線が1番の枠に当たる確率は12番の枠の
   約15倍）。そこで
     前半：見た目どおりのランダムな横線を引く
     後半：先に完全な一様ランダムで決めた「正解の並び」へそろえる横線を引く
           （奇偶転置ソート。隣どうしの入れ替えだけでn段あれば必ず届く）
   としている。後半の横線も普通の横線なので、図は普通のあみだくじとして
   正しくたどれる。                                                   */
function makeStream(seedHex){
  let buf=null,i=32,c=0;
  return function(){
    if(i>=32){buf=sha256Bytes(_enc.encode(seedHex+":"+c));c++;i=0;}
    return buf[i++];
  };
}
function randBelow(next,k){
  if(k<=1)return 0;
  const limit=256-(256%k);
  for(;;){const b=next();if(b<limit)return b%k;}
}
function amidaBuild(mixHex,n){
  const next=makeStream(mixHex);
  const randLv=Math.max(9,n*2),levels=randLv+n;
  const bridges=[],occ=[...Array(n)].map((_,i)=>i);
  for(let lv=0;lv<randLv;lv++){
    let col=0;
    while(col<n-1){
      if(next()<96){bridges.push([lv,col]);const t=occ[col];occ[col]=occ[col+1];occ[col+1]=t;col+=2;}
      else col++;
    }
  }
  const pi=[...Array(n)].map((_,i)=>i);
  for(let i=n-1;i>0;i--){const j=randBelow(next,i+1);const t=pi[i];pi[i]=pi[j];pi[j]=t;}
  const arr=occ.map(x=>pi[x]);
  for(let r=0;r<n;r++){
    for(let p=r%2;p+1<n;p+=2){
      if(arr[p]>arr[p+1]){
        bridges.push([randLv+r,p]);
        let t=arr[p];arr[p]=arr[p+1];arr[p+1]=t;
        t=occ[p];occ[p]=occ[p+1];occ[p+1]=t;
      }
    }
  }
  return {levels,bridges};
}
function amidaTrace(entry,bridges,levels){
  const by={};for(const[l,c]of bridges){(by[l]=by[l]||[]).push(c);}
  let pos=entry;const path=[pos];
  for(let lv=0;lv<levels;lv++){
    for(const c of (by[lv]||[])){
      if(c===pos){pos=c+1;break;}
      if(c+1===pos){pos=c;break;}
    }
    path.push(pos);
  }
  return {goal:pos,path};
}
/** 全員そろった後、各自の端末でこれを計算する（保存先は関与しない） */
function drawResults(C){
  const n=C.e.length;
  const mix=sha256Hex(C.d+"|"+C.e.map(x=>x.k).join("|"));
  const {levels,bridges}=amidaBuild(mix,n);
  const res=C.e.map((x,i)=>{
    const t=amidaTrace(i,bridges,levels);
    return {name:x.n,token:x.k,entry:i,goal:t.goal,path:t.path,slot:C.s[t.goal]};
  }).sort((a,b)=>a.goal-b.goal);
  return {mix,levels,bridges,res};
}

/* ── 小道具 ───────────────────────────────────────── */
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m,err){const t=$('toast');t.textContent=m;t.className='toast show'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',3200);}
function b64e(str){const b=_enc.encode(str);let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');const bin=atob(s+'==='.slice((s.length+3)%4));
  const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(b);}
const baseURL=()=>location.origin+location.pathname;
const myName=()=>localStorage.getItem('amida_me')||'';
const setMyName=v=>localStorage.setItem('amida_me',v);
const getAPI=()=>localStorage.getItem('amida_api')||'';

/* 幹事メニューは「そのくじを作った端末」にだけ出す。
   参加者の画面には配布URLも取り消しボタンも出さない。 */
/* 保存先を自分で設定した端末＝幹事の端末。
   参加者は配られたURLから来るので、この印は付かない。 */
function isOrganizer(){
  if(localStorage.getItem('amida_organizer')) return true;
  // 更新前から幹事として使っていた端末を、そのまま幹事として扱う
  for(let i=0;i<localStorage.length;i++){
    if(String(localStorage.key(i)).indexOf('amida_host_')===0){ setOrganizer(); return true; }
  }
  if(JSON.parse(localStorage.getItem('amida_recent')||'[]').length){ setOrganizer(); return true; }
  return false;
}
const setOrganizer=()=>localStorage.setItem('amida_organizer','1');

/* 「最初へ」ボタンは幹事だけに出す（参加者を作成画面に入れない） */
function setHomeBtn(show){
  const b=$('tb-home'); if(b) b.style.display=show?'':'none';
}

function isHost(id){
  if(localStorage.getItem('amida_host_'+id)) return true;
  try{
    return JSON.parse(localStorage.getItem('amida_recent')||'[]')
      .some(x=>JSON.parse(b64d(x.h)).i===id);
  }catch(e){ return false; }
}
const setAPI=v=>localStorage.setItem('amida_api',v);

async function copyText(t,msg){
  try{
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);}
    else{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity=0;
      document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
    toast(msg||'コピーしました');
  }catch(e){toast('コピーできませんでした。長押しで選択してください。',true);}
}
async function shareText(t){
  if(navigator.share){try{await navigator.share({text:t});return;}catch(e){if(e&&e.name==='AbortError')return;}}
  copyText(t,'コピーしました。メールなどに貼り付けてください。');
}

/* ── 保存先とのやり取り ──────────────────────────────
   Content-Type を付けずに送るのがコツ。付けると事前確認（preflight）が
   走り、Apps Script では通らなくなる。                              */
async function api(action,body){
  const url=ST.api||getAPI();
  if(!url) throw new Error('保存先が設定されていません。');
  let r;
  try{
    r=await fetch(url,{method:'POST',redirect:'follow',
      body:JSON.stringify(Object.assign({action},body||{}))});
  }catch(e){
    throw new Error('保存先につながりません。通信環境と、保存先URLが正しいかを確認してください。');
  }
  const txt=await r.text();
  let j;
  try{ j=JSON.parse(txt); }
  catch(e){ throw new Error('保存先の設定が正しくありません（アクセス権を「全員」にして再デプロイしてください）'); }
  if(!j.ok) throw new Error(j.error||'エラーが発生しました');
  return j;
}

const MX=34,TOPY=52,LVH=11;
let COLW=54;
const xOf=i=>MX+i*COLW;
function drawAmida(c,D){
  const n=c.e.length,lv=D.levels;
  COLW=Math.max(46,Math.min(64,Math.floor((Math.min(window.innerWidth,620)-40-MX*2)/Math.max(1,n-1))));
  const W=MX*2+(n-1)*COLW,botY=TOPY+lv*LVH,H=botY+66;
  let s=`<svg id="svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for(let i=0;i<n;i++)s+=`<line x1="${xOf(i)}" y1="${TOPY}" x2="${xOf(i)}" y2="${botY}" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>`;
  for(const[l,col]of D.bridges){const y=TOPY+(l+1)*LVH;
    s+=`<line x1="${xOf(col)}" y1="${y}" x2="${xOf(col+1)}" y2="${y}" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>`;}
  s+=`<g id="paths"></g>`;
  for(let i=0;i<n;i++){
    s+=`<text x="${xOf(i)}" y="${TOPY-24}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${colorOf(i)}">${i+1}</text>`;
    s+=`<text x="${xOf(i)}" y="${TOPY-7}" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">${esc(c.e[i].n)}</text>`;
  }
  for(let i=0;i<n;i++){
    const t=String(c.s[i]),parts=t.length>6?[t.slice(0,6),t.slice(6,13)]:[t];
    s+=`<text x="${xOf(i)}" y="${botY+16}" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">`
      +parts.map((p,k)=>`<tspan x="${xOf(i)}" dy="${k?12:0}">${esc(p)}</tspan>`).join('')+`</text>`;
  }
  $('amida').innerHTML=s+`</svg>`;
}
function pathD(r,levels){
  let d=`M ${xOf(r.path[0])} ${TOPY-2}`;
  for(let k=0;k<r.path.length;k++){
    const y=TOPY+k*LVH;
    d+=` L ${xOf(r.path[k===0?0:k-1])} ${y}`;
    if(k>0&&r.path[k]!==r.path[k-1]) d+=` L ${xOf(r.path[k])} ${y}`;
  }
  return d+` L ${xOf(r.path[r.path.length-1])} ${TOPY+levels*LVH+4}`;
}
function clearPaths(){const g=$('paths');if(g)g.innerHTML='';}
function playPath(entry,keep){
  if(!_R)return;
  const r=_R.D.res.find(x=>x.entry===entry),g=$('paths');
  if(!r||!g)return;
  if(!keep)g.innerHTML='';
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',pathD(r,_R.D.levels));
  p.setAttribute('class','path-line');
  p.setAttribute('stroke',colorOf(entry));
  g.appendChild(p);
  const L=p.getTotalLength();
  p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
  void p.getBoundingClientRect();
  p.style.transition='stroke-dashoffset 1.1s cubic-bezier(.4,.1,.3,1)';
  p.style.strokeDashoffset=0;
}
function playAll(){clearPaths();_R.D.res.slice().sort((a,b)=>a.entry-b.entry).forEach((r,k)=>setTimeout(()=>playPath(r.entry,true),k*150));}

}

/* ─────────── ルーレット ───────────
   回転はあくまで演出。結果は封印番号と全員の4桁から先に決まっており、
   その決まった枠で必ず止まるように回している。               */
const WS=320,WC=160,WR=138;
const slotColor=i=>`hsl(${HUES[i%HUES.length]} 70% 52%)`;
function polar(r,deg){const t=deg*Math.PI/180;return [WC+r*Math.cos(t),WC+r*Math.sin(t)];}
function sectorPath(r,a0,a1){
  const [x0,y0]=polar(r,a0),[x1,y1]=polar(r,a1);
  return `M ${WC} ${WC} L ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${(a1-a0)>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;
}
const cut=(s,n)=>{s=String(s);return s.length>n?s.slice(0,n)+'…':s;};

/** live=まだ決まっていない枠 / hi=今止まった枠 / rot=現在の回転角 */
function wheelSVG(c,live,hi,rot){
  const n=c.s.length,a=360/n;
  let g='';
  for(let i=0;i<n;i++){
    const a0=-90+i*a,a1=a0+a,on=live.indexOf(i)>=0;
    g+=`<path d="${sectorPath(WR,a0,a1)}" fill="${slotColor(i)}" fill-opacity="${hi===i?1:(on?.85:.15)}" stroke="#fff" stroke-width="2"/>`;
    const mid=a0+a/2,[tx,ty]=polar(WR*0.63,mid),flip=(mid>90||mid<-90)?180:0;
    g+=`<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" `
      +`transform="rotate(${(mid+flip).toFixed(1)} ${tx.toFixed(1)} ${ty.toFixed(1)})" `
      +`font-size="${n>9?10:12}" font-weight="700" fill="#fff" fill-opacity="${on||hi===i?1:.45}">${esc(cut(c.s[i],7))}</text>`;
  }
  return `<div class="wheel-wrap"><svg viewBox="0 0 ${WS} ${WS}" xmlns="http://www.w3.org/2000/svg">`
    +`<g id="wheel-g" style="transform:rotate(${rot}deg)">${g}`
    +`<circle cx="${WC}" cy="${WC}" r="${WR}" fill="none" stroke="#fff" stroke-width="3"/></g>`
    +`<circle cx="${WC}" cy="${WC}" r="27" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>`
    +`<text x="${WC}" y="${WC+5}" text-anchor="middle" font-size="15" font-weight="800" fill="#0f766e">くじ</text>`
    +`<path d="M ${WC-13} 3 L ${WC+13} 3 L ${WC} 31 Z" fill="#dc2626" stroke="#fff" stroke-width="2"/>`
    +`</svg></div>`;
}

/* 盤面の回転角（画面を描き直しても保つ） */
let RROT=0;

/** 記録からすべての抽選を計算し直して確かめる */
function verifyDraws(c){
  const taken=new Set(); const rows=[]; let allOK=true;
  for(let k=0;k<(c.dr||[]).length;k++){
    const d=c.dr[k];
    const remaining=c.s.map((_,i)=>i).filter(i=>!taken.has(i));
    const h=sha256Hex(d.s+'|'+d.t+'|'+c.id+'|'+k);
    const g=remaining[parseInt(h.slice(0,8),16)%remaining.length];
    const ok=(g===d.g); if(!ok) allOK=false;
    rows.push({k,d,ok,left:remaining.length});
    taken.add(d.g);
  }
  return {allOK,rows};
}

  </div>`:''}
  ${isHost(c.id)?`<button class="btn btn-ghost no-print" onclick="go('')">最初へ</button>`:''}`;

  const t=$('b-token');
  if(t) t.addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);ST.token=e.target.value;});
}
function onBName(){
  const v=$('b-name').value;
  if(v&&!(ST.cur.dr||[]).some(d=>d.n===myName())) setMyName(v);
}
function bRand(){ST.token=String(Math.floor(Math.random()*10000)).padStart(4,'0');$('b-token').value=ST.token;}

async function doSpinNow(){
  const nm=($('b-name')||{}).value;
  if(!nm) return toast('名前を選んでください。',true);
  const tk=($('b-token').value||'').trim();
  if(!/^\d{4}$/.test(tk)) return toast('4桁の数字を入れてください。',true);
  setMyName(nm);
  const b=$('b-go'); b.disabled=true; b.textContent='回しています…';
  // スマホで回転が画面の外に出ないよう、円盤を画面中央へ寄せる
  const wb=$('wheel-box');
  if(wb) wb.scrollIntoView({behavior:'smooth',block:'center'});
  ST.busy=true;
  let j;
  try{
    j=await api('spin',{id:ST.id,name:nm,token:tk});
  }catch(e){
    toast(e.message,true);
    b.disabled=false; b.textContent='🎯 回す！';
    ST.busy=false; ST.sig=''; return poll();
  }
  const c=j.current, d=j.draw;
  $('rl-now').innerHTML=`<span style="font-size:12.5px;color:var(--muted);font-weight:400">回っています…</span>${esc(nm)} さん`;
  const a=360/c.s.length;
  const base=-(d.g*a+a/2);                        // 当たった枠を真上へ
  RROT=RROT+360*4+(((base-RROT)%360+360)%360);
  const g=$('wheel-g');
  if(wb) wb.scrollIntoView({block:'center'});
  g.style.transition='transform 3s cubic-bezier(.16,.72,.19,1)';
  void g.getBoundingClientRect();                 // 直前の角度を確定させてから動かす
  g.style.transform=`rotate(${RROT}deg)`;
  setTimeout(()=>{
    if($('rl-now')) $('rl-now').innerHTML=`${esc(nm)} さん<span class="rl-hit">${esc(c.s[d.g])}</span>`;
    setTimeout(()=>{
      ST.token=''; ST.busy=false;
      ST.cur=c; ST.sig=JSON.stringify([c.status,c.dr]);
      if(c.status==='revealed'){clearInterval(timer);timer=null;$('live').style.display='none';}
      viewBoard(c,c.status==='revealed');
      window.scrollTo({top:0,behavior:'smooth'});   // 自分の結果が上に大きく出る
    },1700);
  },3100);
}

function boardText(){
  const c=ST.cur;
  const owner={}; (c.dr||[]).forEach(d=>{owner[d.g]=d;});
  return `【${c.t}】ルーレット結果（${c.at||''}）\n`
    +c.s.map((sl,i)=>`${sl}　：　${owner[i]?owner[i].n:'—'}`).join('\n')
    +`\n\n※このURLを開くと、記録と検算が見られます。\n`+baseURL()+location.hash;
}

  return `

    <div class="hint" style="margin-bottom:10px">

      片方だけでは結果を決められないので、幹事も参加者も操作できません。回す前は誰も結果を知りません。<br>
      使った数字はすべて記録に残るので、<b>全部の抽選をあとから計算し直して確かめられます。</b><br>
      <span style="color:var(--muted-2)">※円盤の回転は演出です。決まった枠で必ず止まるように回しています。</span>
    </div>
    <details class="dt">
      <summary>記録を見る・検算する${V.rows.length?`（${V.allOK?'✓ 全'+V.rows.length+'件一致':'✗ 不一致あり'}）`:''}</summary>
      <div style="margin-top:9px">
        ${V.rows.length?`

          ${V.allOK?'✓':'✗'} この端末で${V.rows.length}件すべてを計算し直し、記録どおりの結果になることを確かめました。
        </div>
        ${V.rows.map(r=>`<div style="border-bottom:1px solid var(--border);padding:8px 0">
          <b>${r.k+1}. ${esc(r.d.n)}</b> → ${esc(c.s[r.d.g])}
          <span style="color:${r.ok?'var(--ok)':'var(--danger)'};font-weight:700">${r.ok?'✓':'✗'}</span>
          <div class="mono" style="margin:5px 0 0">SHA256( ${esc(r.d.s)} ｜ ${esc(r.d.t)} ｜ ${esc(c.id)} ｜ ${r.k} )<br>→ 残り ${r.left} 枠から ${esc(c.s[r.d.g])}</div>

}

/* ─────────── 不正ができない仕組み ─────────── */
function fairBox(c,revealed,D){
  return `
  <div class="card no-print">
    <div class="ct">不正ができない仕組み</div>
    <div class="hint" style="margin-bottom:10px">
      ① くじを作った時点で<b>封印番号</b>が作られ、その要約（ハッシュ値）だけが公開されました。中身は全員そろうまで誰にも渡されません。<br>
      ② 参加者それぞれが<b>4桁の数字</b>を決めます。<br>
      ③ 全員そろって初めて封印番号が公開され、「封印番号＋全員の4桁」から横線の位置が決まります。<br>
      → 幹事は他人の4桁を知らず、参加者は封印番号を知らないので、<b>誰も結果を操作できません。</b><br>
      あみだの線を引く計算は<b>開いた人それぞれの端末</b>で行われるので、保存先が結果を差し替えることもできません。
    </div>
    <details class="dt">
      <summary>公開データを見る${revealed?'（検算ずみ）':''}</summary>
      <div style="margin-top:9px">
        <label>封印番号のハッシュ値（作成時に公開・変更不可）</label>
        <div class="mono">${esc(c.c)}</div>
        ${revealed?`
        <label>封印番号（全員そろって公開された値）</label>
        <div class="mono">${esc(c.d)}</div>
        <label>まぜ合わせた値（ここから横線が決まる）</label>
        <div class="mono">${esc(D.mix)}</div>
        <div class="alert ${sha256Hex(c.d)===c.c?'alert-ok':'alert-err'}" style="margin-bottom:0">
          ${sha256Hex(c.d)===c.c?'✓':'✗'} 封印番号のハッシュ値が一致<br>
          ✓ この端末で横線${D.bridges.length}本を計算し直して図を描いています
        </div>`
        :`<div class="hint">全員そろうと、ここに封印番号そのものが表示され、この値と一致するか自動で検算されます。</div>`}
      </div>
    </details>
  </div>`;
}
