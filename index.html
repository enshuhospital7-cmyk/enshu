<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="referrer" content="no-referrer">
<title>あみだくじ｜当番決め</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --primary:#0d9488;--primary-dark:#0f766e;--primary-light:#ccfbf1;--primary-soft:#f0fdfa;
  --accent:#0284c7;--accent-light:#e0f2fe;
  --bg:#eef2f7;--surface:#fff;--surface-2:#f8fafc;
  --border:#e6ebf1;--border-strong:#cbd5e1;
  --text:#1e293b;--muted:#64748b;--muted-2:#94a3b8;
  --danger:#dc2626;--danger-soft:#fef2f2;--danger-border:#fecaca;
  --warn:#d97706;--warn-soft:#fffbeb;--warn-border:#fde68a;
  --ok:#059669;--ok-soft:#ecfdf5;--ok-border:#a7f3d0;
  --radius:14px;--shadow:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
}
html{-webkit-text-size-adjust:100%;}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI',Meiryo,-apple-system,sans-serif;
  font-size:15px;line-height:1.6;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);}

.topbar{background:linear-gradient(90deg,#0f766e,#0d9488);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:50;box-shadow:0 1px 8px rgba(15,23,42,.16);}
.logo{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.tt{font-size:15px;font-weight:700;line-height:1.3;min-width:0;flex:1;}
.tt small{display:block;font-size:11px;font-weight:400;opacity:.85;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tb-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 12px;border-radius:9px;font-size:12px;cursor:pointer;font-family:inherit;flex-shrink:0;}

.wrap{max-width:640px;margin:0 auto;padding:16px 14px 60px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.ct{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.ct::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--primary);flex-shrink:0;}
.hint{font-size:12.5px;color:var(--muted);line-height:1.8;}
label{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:5px;}

input[type=text],textarea,select{width:100%;font-size:16px;padding:11px 13px;border:1px solid var(--border-strong);
  border-radius:10px;font-family:inherit;background:#fff;color:var(--text);outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
textarea{resize:vertical;line-height:1.8;}
.fld{margin-bottom:14px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 18px;border-radius:11px;
  cursor:pointer;font-size:14.5px;border:1px solid var(--border-strong);background:#fff;color:var(--text);
  font-family:inherit;font-weight:600;width:100%;margin-bottom:9px;}
.btn:active{transform:scale(.99);}
.btn:disabled{opacity:.45;}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 6px rgba(13,148,136,.3);}
.btn-line{background:#06C755;color:#fff;border-color:#06C755;box-shadow:0 2px 6px rgba(6,199,85,.3);}
.btn-ghost{background:var(--surface-2);color:var(--muted);}
.btn-danger{color:var(--danger);border-color:var(--danger-border);}
.btn-row{display:flex;gap:9px;}
.btn-row .btn{margin-bottom:0;}
.btn-sm{width:auto;padding:7px 13px;font-size:12.5px;border-radius:8px;margin-bottom:0;}

.alert{padding:12px 14px;border-radius:11px;font-size:13.5px;margin-bottom:13px;line-height:1.75;border:1px solid;}
.alert-ok{background:var(--ok-soft);color:#065f46;border-color:var(--ok-border);}
.alert-warn{background:var(--warn-soft);color:#92400e;border-color:var(--warn-border);}
.alert-err{background:var(--danger-soft);color:#991b1b;border-color:var(--danger-border);}
.info{background:var(--accent-light);border:1px solid #bae6fd;border-left:3px solid var(--accent);border-radius:10px;
  padding:12px 14px;font-size:12.5px;color:#075985;line-height:1.85;margin-bottom:14px;}
.info b{color:#0c4a6e;}

.step{display:flex;gap:11px;margin-bottom:13px;align-items:flex-start;}
.step-n{width:25px;height:25px;border-radius:50%;background:var(--primary);color:#fff;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.step-b{font-size:13.5px;line-height:1.75;}
.step-b b{display:block;font-size:14px;margin-bottom:1px;color:var(--text);}

/* 縦線えらび */
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;}
.pick{border:1.5px solid var(--border-strong);background:#fff;border-radius:12px;padding:12px 4px;text-align:center;
  cursor:pointer;font-family:inherit;}
.pick .n{font-size:22px;font-weight:800;color:var(--primary-dark);display:block;line-height:1.1;}
.pick .s{font-size:10.5px;color:var(--muted-2);display:block;margin-top:3px;min-height:14px;}
.pick.sel{border-color:var(--primary);background:var(--primary);box-shadow:0 3px 10px rgba(13,148,136,.35);}
.pick.sel .n,.pick.sel .s{color:#fff;}
.pick.taken{background:var(--surface-2);border-color:var(--border);cursor:not-allowed;}
.pick.taken .n{color:var(--muted-2);}
.pick.taken .s{color:var(--text);font-weight:700;}

.code-box{background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;border-radius:14px;padding:20px 16px;text-align:center;margin-bottom:13px;}
.code-box .cl{font-size:12px;opacity:.85;}
.code-box .cv{font-size:30px;font-weight:800;letter-spacing:.04em;margin:6px 0 2px;font-family:'Hiragino Kaku Gothic ProN',sans-serif;word-break:break-all;}

.big{background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;border-radius:16px;padding:22px 18px;text-align:center;margin-bottom:14px;box-shadow:0 6px 20px rgba(13,148,136,.3);}
.big .l{font-size:12px;opacity:.85;}
.big .n{font-size:15px;font-weight:600;margin-top:3px;}
.big .v{font-size:29px;font-weight:800;margin-top:6px;line-height:1.25;}

table.tbl{width:100%;border-collapse:collapse;font-size:14px;}
table.tbl th{text-align:left;padding:8px 8px;color:var(--muted);font-weight:600;font-size:11px;border-bottom:2px solid var(--border);background:var(--surface-2);}
table.tbl td{padding:10px 8px;border-bottom:1px solid var(--border);}
table.tbl tr.me td{background:var(--warn-soft);font-weight:700;}
table.tbl tr.bad td{background:var(--danger-soft);}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:-1px;}

.amida-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px;}
.amida-scroll svg{display:block;}
.path-line{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;}

.chip{display:inline-block;padding:5px 11px;border-radius:99px;font-size:12px;border:1px solid var(--border);background:var(--surface-2);margin:2px;}
.mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:11px;word-break:break-all;background:var(--surface-2);
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:4px 0 10px;}
details.dt{border:1px solid var(--border);border-radius:11px;padding:11px 14px;background:var(--surface-2);font-size:12.5px;}
details.dt summary{cursor:pointer;font-weight:700;color:var(--muted);}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#1e293b;color:#fff;padding:12px 20px;
  border-radius:11px;font-size:13.5px;box-shadow:0 8px 24px rgba(15,23,42,.35);z-index:900;opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.toast.err{background:#991b1b;}
@media print{.topbar,.no-print{display:none!important}.wrap{padding:0}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">🎋</div>
  <div class="tt">あみだくじ<small id="sub">当番決め</small></div>
  <button class="tb-btn no-print" onclick="go('')">最初へ</button>
</div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   あみだくじ（サーバー不要・GitHub Pages 版）

   ● なぜサーバーが要らないのか
     くじの内容も、抽選結果も、すべて URL の「#」以降に詰め込んで
     受け渡します。「#」以降はサーバーに送信されない部分なので、
     GitHub にも誰のところにも職員名は残りません。

   ● 不正ができない仕組み（コミット・アンド・リビール）
     1. 幹事の端末が「封印番号」を作り、その要約(SHA-256ハッシュ)だけを
        参加用URLに入れて配る。封印番号そのものは幹事の端末に保管。
     2. 参加者は縦線と4桁の数字を選び、コードを返信する。
     3. 全員そろったら「封印番号＋全員の4桁」から横線の位置を決める。
     → 幹事は他人の4桁を知らず、参加者は封印番号を知らないので
       誰も結果を操作できない。結果URLでは封印番号が公開され、
       最初に配ったハッシュ値と一致するか誰でも検算できる。
   ══════════════════════════════════════════════════════════════ */

/* ── SHA-256（自前実装：どのブラウザでも同じ結果になる） ── */
const _K=new Uint32Array([
0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
const _r=(x,n)=>((x>>>n)|(x<<(32-n)))>>>0;
function sha256Bytes(data){
  const len=data.length,bl=len*8,total=(((len+9)+63)>>6)<<6;
  const m=new Uint8Array(total);m.set(data);m[len]=0x80;
  const dv=new DataView(m.buffer);
  dv.setUint32(total-8,Math.floor(bl/4294967296));dv.setUint32(total-4,bl>>>0);
  const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const w=new Uint32Array(64);
  for(let off=0;off<total;off+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(off+i*4);
    for(let i=16;i<64;i++){
      const x=w[i-15],y=w[i-2];
      w[i]=(w[i-16]+((_r(x,7)^_r(x,18)^(x>>>3))>>>0)+w[i-7]+((_r(y,17)^_r(y,19)^(y>>>10))>>>0))>>>0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){
      const S1=(_r(e,6)^_r(e,11)^_r(e,25))>>>0,ch=((e&f)^((~e)&g))>>>0;
      const t1=(h+S1+ch+_K[i]+w[i])>>>0;
      const S0=(_r(a,2)^_r(a,13)^_r(a,22))>>>0,mj=((a&b)^(a&c)^(b&c))>>>0;
      const t2=(S0+mj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
  }
  const o=new Uint8Array(32),odv=new DataView(o.buffer);
  for(let i=0;i<8;i++)odv.setUint32(i*4,H[i]);
  return o;
}
const _enc=new TextEncoder();
function sha256Hex(s){const b=sha256Bytes(_enc.encode(s));let r='';for(let i=0;i<32;i++)r+=b[i].toString(16).padStart(2,'0');return r;}

/* ── あみだの横線を決める（封印番号＋全員の4桁から一意に決まる） ──

   【なぜ単純に横線を引くだけではダメか】
   横線をランダムに引くだけだと、あみだは「隣どうしの入れ替え」を
   くり返す動きになるため、出発点の近くに留まりやすくなります。
   実測では、1番の縦線が1番の枠に当たる確率が12番の枠の15倍もあり、
   当番決めには使えません。

   そこで2段構えにしています。
     前半：見た目どおりのランダムな横線を引く（あみだらしさ）
     後半：先に完全な一様ランダムで決めた「正解の並び」に合わせるための
           横線を引く（奇偶転置ソート。隣どうしの入れ替えだけで
           n段あれば必ず目的の並びにできる）
   結果として、最終的な並びは<b>完全に一様</b>になります。
   後半の横線も「隣どうしを結ぶ普通の横線」なので、
   出来上がった図は普通のあみだくじとして正しくたどれます。            */
function makeStream(seedHex){          // SHA-256を連鎖させた乱数バイト列
  let buf=null,i=32,c=0;
  return function(){
    if(i>=32){buf=sha256Bytes(_enc.encode(seedHex+":"+c));c++;i=0;}
    return buf[i++];
  };
}
function randBelow(next,k){            // 0以上k未満を偏りなく取り出す
  if(k<=1)return 0;
  const limit=256-(256%k);
  for(;;){const b=next();if(b<limit)return b%k;}
}
function amidaBuild(mixHex,n){
  const next=makeStream(mixHex);
  const randLv=Math.max(9,n*2),levels=randLv+n;
  const bridges=[],occ=[...Array(n)].map((_,i)=>i);   // occ[p]=位置pにいる人
  // 前半：ランダムな横線（37.5%／隣どうしは作らない）
  for(let lv=0;lv<randLv;lv++){
    let col=0;
    while(col<n-1){
      if(next()<96){bridges.push([lv,col]);const t=occ[col];occ[col]=occ[col+1];occ[col+1]=t;col+=2;}
      else col++;
    }
  }
  // 正解の並びを一様ランダムに決める（フィッシャー・イェーツ）
  const pi=[...Array(n)].map((_,i)=>i);
  for(let i=n-1;i>0;i--){const j=randBelow(next,i+1);const t=pi[i];pi[i]=pi[j];pi[j]=t;}
  // 後半：奇偶転置ソートで正解の並びへそろえる
  const arr=occ.map(x=>pi[x]);
  for(let r=0;r<n;r++){
    for(let p=r%2;p+1<n;p+=2){
      if(arr[p]>arr[p+1]){
        bridges.push([randLv+r,p]);
        let t=arr[p];arr[p]=arr[p+1];arr[p+1]=t;
        t=occ[p];occ[p]=occ[p+1];occ[p+1]=t;
      }
    }
  }
  return {levels,bridges};
}
function amidaTrace(entry,bridges,levels){
  const by={};for(const[l,c]of bridges){(by[l]=by[l]||[]).push(c);}
  let pos=entry;const path=[pos];
  for(let lv=0;lv<levels;lv++){
    for(const c of (by[lv]||[])){
      if(c===pos){pos=c+1;break;}
      if(c+1===pos){pos=c;break;}
    }
    path.push(pos);
  }
  return {goal:pos,path};
}
function calcMix(seed,tokens){return sha256Hex(seed+"|"+tokens.join("|"));}
function drawResults(K){
  const n=K.e.length, tokens=K.e.map(x=>x[1]);
  const mix=calcMix(K.d,tokens);
  const {levels,bridges}=amidaBuild(mix,n);
  const res=K.e.map((x,i)=>{
    const t=amidaTrace(i,bridges,levels);
    return {name:x[0],token:x[1],entry:i,goal:t.goal,path:t.path,slot:K.s[t.goal]};
  }).sort((a,b)=>a.goal-b.goal);
  return {mix,levels,bridges,res};
}

/* ── URL に載せる（#以降なのでサーバーには一切送られない） ── */
function b64e(str){
  const b=_enc.encode(str);let s='';
  for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64d(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/');
  const bin=atob(s+'==='.slice((s.length+3)%4));
  const b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}
const packK=o=>b64e(JSON.stringify(o));
const unpackK=s=>JSON.parse(b64d(s));
const baseURL=()=>location.origin+location.pathname;
const urlFor=(k,o)=>baseURL()+'#'+k+'='+packK(o);

/* ── ちいさな道具 ── */
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m,err){const t=$('toast');t.textContent=m;t.className='toast show'+(err?' err':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',3000);}
function rndHex(n){
  const a=new Uint8Array(n);
  (window.crypto||window.msCrypto).getRandomValues(a);
  return [...a].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function copyText(t,msg){
  try{
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);}
    else{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity=0;
      document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
    toast(msg||'コピーしました');
  }catch(e){toast('コピーできませんでした。長押しで選択してください。',true);}
}
async function shareText(t){
  if(navigator.share){try{await navigator.share({text:t});return;}catch(e){if(e&&e.name==='AbortError')return;}}
  copyText(t,'コピーしました。LINEに貼り付けてください。');
}
const myName=()=>localStorage.getItem('amida_me')||'';
const setMyName=v=>localStorage.setItem('amida_me',v);
const seedKey=id=>'amida_seed_'+id;

/* ══════════════════════════════════════════════════════════════
   画面の切り替え（URLの # を見て判断）
   ══════════════════════════════════════════════════════════════ */
function go(hash){location.hash=hash;if(!hash)route();}
window.addEventListener('hashchange',route);

function route(){
  const h=location.hash.replace(/^#/,'');
  const m=h.match(/^([shr])=(.+)$/);
  try{
    if(!m){ $('sub').textContent='当番決め'; return viewHome(); }
    const K=unpackK(m[2]);
    $('sub').textContent=K.t||'当番決め';
    if(m[1]==='r') return viewResult(K);
    if(m[1]==='h') return viewHost(K,true);
    return viewJoin(K);
  }catch(e){

/* LINEのトークから「名前 番号-4桁」を読み取る */
function parseCodes(text,roster){
  const found={};   // name -> {line,token}
  const dup=[];
  for(const raw of String(text).split(/\r?\n/)){
    const mm=raw.match(/(\d{1,2})\s*[-‐‑–—ー－]\s*(\d{4})/);
    if(!mm) continue;
    // その行に含まれる参加者名のうち、いちばん長く一致するものを採用
    let hit=null;
    for(const nm of roster){ if(raw.indexOf(nm)>=0 && (!hit||nm.length>hit.length)) hit=nm; }
    if(!hit) continue;
    found[hit]={line:parseInt(mm[1],10),token:mm[2]};   // 同じ人が複数回送ったら最後を採用
  }
  const byLine={};
  for(const nm in found){
    const L=found[nm].line;
    (byLine[L]=byLine[L]||[]).push(nm);
  }
  for(const L in byLine) if(byLine[L].length>1) dup.push({line:+L,names:byLine[L]});
  return {found,dup};
}
function collect(){
  const K=window._K,n=K.p.length;
  const text=$('h-paste').value;
  localStorage.setItem('amida_paste_'+K.id,text);
  const {found,dup}=parseCodes(text,K.p);
  const miss=K.p.filter(nm=>!found[nm]);
  const bad=Object.keys(found).filter(nm=>found[nm].line<1||found[nm].line>n);
  const ok=miss.length===0&&dup.length===0&&bad.length===0;
  const dupNames=[].concat(...dup.map(d=>d.names));

  $('h-status').innerHTML=`
  <div class="card">
    <div class="ct">3. 受付状況（${Object.keys(found).length}/${n}人）</div>
    <table class="tbl">
      <thead><tr><th style="width:52px">縦線</th><th>名前</th><th style="width:70px">4桁</th></tr></thead>
      <tbody>${K.p.map(nm=>{
        const f=found[nm];
        const isDup=dupNames.indexOf(nm)>=0;
        const isBad=f&&(f.line<1||f.line>n);
        return `<tr class="${isDup||isBad?'bad':''}">
          <td><b>${f?f.line:'—'}</b></td>
          <td>${esc(nm)}${isDup?' <span style="color:var(--danger);font-size:11px">重複</span>':''}${isBad?' <span style="color:var(--danger);font-size:11px">範囲外</span>':''}</td>
          <td style="font-family:monospace">${f?esc(f.token):'<span style="color:var(--muted-2)">未</span>'}</td>
        </tr>`;}).join('')}
      </tbody>
    </table>
    ${miss.length?`<div class="alert alert-warn" style="margin-top:12px">まだの人：<b>${miss.map(esc).join('、')}</b></div>`:''}
    ${dup.length?`<div class="alert alert-err" style="margin-top:12px">
      同じ縦線を選んだ人がいます。<br>${dup.map(d=>`<b>${d.line}番</b>：${d.names.map(esc).join('・')}`).join('<br>')}
      <br>どちらかに別の空き番号を選び直してもらい、新しいコードを貼り直してください。</div>`:''}
    ${bad.length?`<div class="alert alert-err" style="margin-top:12px">1〜${n}以外の番号があります：${bad.map(esc).join('、')}</div>`:''}
  </div>
  <button class="btn btn-primary" ${ok?'':'disabled'} onclick="doReveal()">
    ${ok?'🎋 抽選する（全員そろいました）':'全員そろうまで抽選できません'}
  </button>`;
  window._found=found;
}
function doReveal(){
  const K=window._K,found=window._found,n=K.p.length;
  const e=[];
  for(let i=1;i<=n;i++){
    const nm=K.p.find(x=>found[x]&&found[x].line===i);
    if(!nm) return toast('受付内容に抜けがあります。',true);
    e.push([nm,found[nm].token]);
  }
  const R=Object.assign({},K,{d:window._seed,e,at:new Date().toLocaleString('ja-JP')});
  delete R.p;
  go('r='+packK(R));
}

  </div>

  <div class="card">
    <div class="ct">あみだ図</div>
    <div class="hint" style="margin-bottom:8px">← 横にスクロールできます →</div>
    <div class="amida-scroll" id="amida"></div>
    <div class="btn-row no-print" style="margin-top:11px">
      <button class="btn" onclick="playAll()">▶ 全員</button>
      <button class="btn btn-ghost" onclick="clearPaths()">クリア</button>
    </div>
  </div>

  <div class="btn-row no-print">
    <button class="btn btn-line" onclick="shareText(resultText())">結果をLINEで送る</button>
    <button class="btn" onclick="copyText(location.href,'結果URLをコピーしました')">結果URLをコピー</button>
  </div>

  ${fairBox(K,true,D)}
  <button class="btn btn-ghost no-print" onclick="go('')">最初へ</button>`;
  drawAmida(K,D);
  setTimeout(()=>mine?playPath(mine.entry):playAll(),350);
}
function resultText(){
  const {K,D}=_R;
  return `【${K.t}】あみだくじ結果（${K.at||''}）\n`
    +D.res.map(r=>`${r.slot}　：　${r.name}`).join('\n')
    +`\n\n※このURLを開くと、あみだ図と検算結果が見られます。\n`+location.href;
}

/* あみだ図の描画 */
const MX=34,TOPY=52,LVH=11;
let COLW=54;
function xOf(i){return MX+i*COLW;}
function drawAmida(K,D){
  const n=K.e.length,lv=D.levels;
  COLW=Math.max(46,Math.min(64,Math.floor((Math.min(window.innerWidth,620)-40-MX*2)/Math.max(1,n-1))));
  const W=MX*2+(n-1)*COLW,botY=TOPY+lv*LVH,H=botY+66;
  let s=`<svg id="svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for(let i=0;i<n;i++)s+=`<line x1="${xOf(i)}" y1="${TOPY}" x2="${xOf(i)}" y2="${botY}" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>`;
  for(const[l,c]of D.bridges){const y=TOPY+(l+1)*LVH;
    s+=`<line x1="${xOf(c)}" y1="${y}" x2="${xOf(c+1)}" y2="${y}" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>`;}
  s+=`<g id="paths"></g>`;
  for(let i=0;i<n;i++){
    s+=`<text x="${xOf(i)}" y="${TOPY-24}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${colorOf(i)}">${i+1}</text>`;
    s+=`<text x="${xOf(i)}" y="${TOPY-7}" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">${esc(K.e[i][0])}</text>`;
  }
  for(let i=0;i<n;i++){
    const t=String(K.s[i]),parts=t.length>6?[t.slice(0,6),t.slice(6,13)]:[t];
    s+=`<text x="${xOf(i)}" y="${botY+16}" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">`
      +parts.map((p,k)=>`<tspan x="${xOf(i)}" dy="${k?12:0}">${esc(p)}</tspan>`).join('')+`</text>`;
  }
  $('amida').innerHTML=s+`</svg>`;
}
function pathD(r,levels){
  let d=`M ${xOf(r.path[0])} ${TOPY-2}`;
  for(let k=0;k<r.path.length;k++){
    const y=TOPY+k*LVH;
    d+=` L ${xOf(r.path[k===0?0:k-1])} ${y}`;
    if(k>0&&r.path[k]!==r.path[k-1]) d+=` L ${xOf(r.path[k])} ${y}`;
  }
  return d+` L ${xOf(r.path[r.path.length-1])} ${TOPY+levels*LVH+4}`;
}
function clearPaths(){const g=$('paths');if(g)g.innerHTML='';}
function playPath(entry,keep){
  if(!_R)return;
  const r=_R.D.res.find(x=>x.entry===entry);const g=$('paths');
  if(!r||!g)return;
  if(!keep)g.innerHTML='';
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',pathD(r,_R.D.levels));
  p.setAttribute('class','path-line');
  p.setAttribute('stroke',colorOf(entry));
  g.appendChild(p);
  const L=p.getTotalLength();
  p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
  p.style.transition='stroke-dashoffset 1.1s cubic-bezier(.4,.1,.3,1)';
  requestAnimationFrame(()=>{p.style.strokeDashoffset=0;});
}
function playAll(){clearPaths();_R.D.res.slice().sort((a,b)=>a.entry-b.entry).forEach((r,k)=>setTimeout(()=>playPath(r.entry,true),k*150));}

/* ─────────────── 不正ができない仕組み ─────────────── */
function fairBox(K,revealed,D){
  return `
  <div class="card no-print">
    <div class="ct">不正ができない仕組み</div>
    <div class="hint" style="margin-bottom:10px">
      ① くじを作った時点で幹事の端末が<b>封印番号</b>を作り、その要約（ハッシュ値）だけを配りました。中身は抽選まで誰も見られません。<br>
      ② 参加者それぞれが<b>4桁の数字</b>を決めます。<br>
      ③ 全員そろったら「封印番号＋全員の4桁」から横線の位置が決まります。<br>
      → 幹事は他人の4桁を知らず、参加者は封印番号を知らないので、<b>誰も結果を操作できません。</b>
    </div>
    <details class="dt">
      <summary>公開データを見る${revealed?'（検算ずみ）':''}</summary>
      <div style="margin-top:9px">
        <label>封印番号のハッシュ値（最初に配ったURLに入っている値）</label>
        <div class="mono">${esc(K.c)}</div>
        ${revealed?`
        <label>封印番号（結果と同時に公開）</label>
        <div class="mono">${esc(K.d)}</div>
        <label>まぜ合わせた値（ここから横線が決まる）</label>
        <div class="mono">${esc(D.mix)}</div>
        <div class="alert ${sha256Hex(K.d)===K.c?'alert-ok':'alert-err'}" style="margin-bottom:0">
          ${sha256Hex(K.d)===K.c?'✓':'✗'} 封印番号のハッシュ値が一致<br>
          ${'✓'} この端末で横線${D.bridges.length}本を計算し直して図を描いています<br>
          <span style="font-size:11.5px">上のハッシュ値が、最初にLINEで配られたURLのものと同じか見比べてください。同じなら、線は後から作り替えられていません。</span>
        </div>`
        :`<div class="hint">抽選が終わると、ここに封印番号そのものが表示され、この値と一致するか自動で検算されます。</div>`}
      </div>
    </details>
  </div>`;
}

route();
window.addEventListener('resize',()=>{if(_R&&$('amida')){drawAmida(_R.K,_R.D);}});
</script>
</body>
</html>
